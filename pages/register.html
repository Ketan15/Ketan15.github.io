<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bhatts Organic Food & Spices</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-left">
                <div class="logo">
					<img src="../images/logo.jpg" alt="Bhatts Organic" class="brand-logo">
				</div>
                <h2>Join Us Today!</h2>
                <p>Create your account to start shopping for premium organic spices. Fresh, pure, and delivered to your doorstep.</p>
                <div style="margin-top:40px; opacity:0.7; font-size:60px;">🌱✨🚚</div>
            </div>
            <div class="auth-right">
                <h2>Create Account</h2>
                <form id="registerForm" onsubmit="return handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="regMobile" placeholder="Enter 10-digit mobile number" required pattern="[0-9]{10}" maxlength="10">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create password (min 6 chars)" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                        Register <i class="fas fa-user-plus"></i>
                    </button>
                </form>
                <div class="auth-link">
                    Already have an account? <a href="login.html">Login</a>
                </div>
                <div class="auth-link" style="margin-top:10px;">
                    <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
